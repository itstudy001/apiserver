name: GitHubAction_AWSCICD
on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # OIDC JWT 토큰 발급에 필수
  contents: read    # 코드 체크아웃 시 필요

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: apiserver
  ECR_CLUSTER: itstudycluster
  ECS_SERVICE: nginxservice
  ECS_TASK_DEFINITION: ./task-definition.json
  CONTAINER_NAME: apiserver

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python1
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::208060188195:role/apiserver_role
          aws-region: ap-northeast-2 

    